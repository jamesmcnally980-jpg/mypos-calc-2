<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Venue Rota Maker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1f24">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rota Maker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  /* shift locations, matching the spreadsheet rota */
  --bk:#b6d7a8; --bk-bd:#6aa84f;
  --me:#ea9999; --me-bd:#cc4125;
  --pub:#a4c2f4; --pub-bd:#3c78d8;
  --other:#ff9900; --grey:#d9d9d9; --hol:#ff00ff;
  --mgmt:#f6b26b; --mgmt-lt:#fce5cd; --team:#ffd966; --team-lt:#fff2cc;
  --ig-sport:#ffd84d; --ig-fb:#c9daf8; --ig-me:#f4cccc; --ig-gen:#fff2cc;
  --ink:#1c1f24; --muted:#6b7280; --line:#e2e5ea; --bg:#f4f5f7; --card:#ffffff;
  --grid:#c8ccd2;
  --danger:#d92d20; --danger-bg:#fdeceb; --warn:#b45309; --ok:#15803d;
  --accent:#3c78d8;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-left:max(16px,env(titlebar-area-x,16px));padding-right:max(16px,calc(100vw - env(titlebar-area-x,0px) - env(titlebar-area-width,100vw) + 16px));-webkit-app-region:drag;app-region:drag;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
header.top button{-webkit-app-region:no-drag;app-region:no-drag;}
header.top h1{font-size:17px;margin:0;flex:1;min-width:160px;}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:19;overflow-x:auto;}
nav.tabs button{border:none;background:none;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--accent);}
main{padding:14px;max-width:1500px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.card h2{margin:0 0 10px;font-size:15px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
button.btn{background:var(--ink);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit;}
button.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
button.btn.danger{background:var(--danger);}
button.btn.small{padding:5px 9px;font-size:12px;}
button.btn:disabled{opacity:.5;cursor:not-allowed;}
input,select,textarea{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px;}
.field{margin-bottom:8px;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;}
th{background:#fafafa;}
.grid-wrap{overflow-x:auto;}
.warnbox{background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;}
.warnbox ul{margin:6px 0 0;padding-left:18px;}
.warnbox details summary{cursor:pointer;font-weight:600;}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;}
.pill{background:#eef0f3;border-radius:999px;padding:3px 9px;font-size:11.5px;}
.modal-bg{position:fixed;inset:0;background:#00000066;display:flex;align-items:center;justify-content:center;z-index:100;padding:14px;}
.modal{background:#fff;border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;}
.modal h3{margin-top:0;}
.modal h4{margin:14px 0 6px;font-size:13px;}
.closeX{float:right;cursor:pointer;font-size:18px;color:var(--muted);}
.staff-table td,.staff-table th{font-size:12px;}
.checks{display:flex;gap:10px;flex-wrap:wrap;}
.checks label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);}
.small-muted{color:var(--muted);font-size:11.5px;}
.hours-total{font-weight:700;}
.hours-total.under{color:var(--warn);}
.hours-total.over{color:var(--danger);}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px;}
.swatch.breakfast{background:var(--bk);} .swatch.me{background:var(--me);} .swatch.pub{background:var(--pub);}
.shift-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;}

/* ---------- Spreadsheet-style rota ---------- */
.sheet-card{padding:10px;}
table.sheet{border-collapse:collapse;width:100%;min-width:1000px;table-layout:fixed;font-size:10.5px;}
table.sheet th,table.sheet td{border:1px solid var(--grid);padding:0;text-align:center;vertical-align:middle;height:25px;}
table.sheet thead th{background:#fff;font-weight:500;font-size:9.5px;letter-spacing:.4px;line-height:1.25;padding:3px 2px;}
table.sheet thead th .dnum{font-size:10px;letter-spacing:0;}
table.sheet col.c-grp{width:24px;} table.sheet col.c-name{width:150px;} table.sheet col.c-hrs{width:62px;}
td.grp{font-weight:700;font-size:9.5px;letter-spacing:.3px;}
td.grp span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;}
td.grp.g-management{background:var(--mgmt);} td.grp.g-team{background:var(--team);}
td.name{font-size:10.5px;padding:2px 4px;}
tr.g-management td.name{background:var(--mgmt-lt);} tr.g-team td.name{background:var(--team-lt);}
td.cell{cursor:pointer;background:#fff;}
td.cell:hover{box-shadow:inset 0 0 0 2px var(--ink);}
.sh{display:flex;align-items:center;justify-content:center;min-height:24px;padding:3px 3px;line-height:1.25;}
.sh + .sh,.sh + .st,.st + .sh{border-top:1px solid #ffffffaa;}
.sh.breakfast{background:var(--bk);} .sh.me{background:var(--me);} .sh.pub{background:var(--pub);}
.sh.problem{box-shadow:inset 3px 0 0 var(--danger);}
.st{display:flex;align-items:center;justify-content:center;min-height:24px;padding:3px;font-size:10px;}
.st.m-HOL{color:var(--hol);}
.st.m-ADMIN,.st.m-VP{background:var(--other);}
.st.m-UNI{background:var(--grey);}
.st.m-SICK{background:#e06666;color:#fff;}
td.span-week{background:var(--grey);font-size:10px;font-weight:500;cursor:pointer;}
td.span-week.m-HOL{background:#fff;color:var(--hol);}
td.span-week.m-ADMIN,td.span-week.m-VP{background:var(--other);}
td.hrs{font-size:10px;line-height:1.2;padding:2px;}
td.hrs .small-muted{font-size:9px;}
tr.sep td{background:#000;height:7px;border:none;}
td.igrp{font-weight:700;font-size:9.5px;}
td.igrp span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;}
td.ilabel{font-size:10px;padding:2px 4px;}
td.info{font-size:10px;padding:0;white-space:pre-wrap;line-height:1.3;}
td.info .auto{padding:3px 3px 0;font-weight:500;}
td.info .ed{min-height:24px;padding:4px 3px;outline:none;}
td.info .ed:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
td.info .ed.sport{color:#cc0000;}
tr.ig-sport td{background:#fff;} tr.ig-sport td.igrp{background:var(--ig-sport);}
tr.ig-fb td{background:var(--ig-fb);} tr.ig-me td{background:var(--ig-me);} tr.ig-gen td{background:var(--ig-gen);}
tr.ig-gen td.ilabel{font-weight:600;}
tr.key td{font-size:10px;font-weight:500;background:#fff;}
tr.key td.k-breakfast{background:var(--bk);} tr.key td.k-me{background:var(--me);} tr.key td.k-pub{background:var(--pub);} tr.key td.k-other{background:var(--other);} tr.key td.k-uni{background:var(--grey);}
.sheet-tip{font-size:11.5px;color:var(--muted);margin-top:8px;}

/* Chat */
#chatFab{position:fixed;bottom:18px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;border:none;cursor:pointer;box-shadow:0 4px 14px #0003;z-index:200;}
#chatPanel{position:fixed;bottom:82px;right:18px;width:340px;max-width:92vw;height:460px;max-height:70vh;background:#fff;border-radius:12px;box-shadow:0 8px 30px #0004;display:none;flex-direction:column;z-index:200;border:1px solid var(--line);}
#chatPanel.open{display:flex;}
#chatHead{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
#chatMsgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
.msg{padding:7px 10px;border-radius:10px;font-size:12.5px;max-width:85%;line-height:1.4;white-space:pre-wrap;}
.msg.bot{background:#f1f3f5;align-self:flex-start;}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;}
#chatInputRow{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);}
#chatInputRow input{flex:1;}
.hint-chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 8px 8px;}
.hint-chips button{font-size:10.5px;padding:4px 7px;border-radius:999px;background:#eef0f3;border:none;cursor:pointer;font-family:inherit;}
@media print{
  header.top,nav.tabs,#chatFab,#chatPanel,.no-print{display:none!important;}
  main{padding:0;max-width:none;}
  body{background:#fff;}
  @page{size:A4 landscape;margin:8mm;}
  .card{border:none;box-shadow:none;padding:0;}
  .grid-wrap{overflow:visible;}
  table.sheet{min-width:0;font-size:8px;}
  table.sheet th,table.sheet td{height:auto;}
  table.sheet td,table.sheet th,table.sheet td.name,table.sheet td.ilabel,table.sheet td.info,table.sheet .st,table.sheet thead th .dnum{font-size:7.5px;}
  table.sheet td.name,table.sheet td.ilabel{padding:0 3px;}
  table.sheet td.hrs .small-muted{display:none;}
  .sh,.st,td.info .ed{min-height:15px;padding:1px 2px;}
  tr.sep td{height:5px;}
  tr{break-inside:avoid;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
@media (max-width:720px){
  #chatPanel{right:8px;left:8px;width:auto;}
}
</style>
</head>
<body>
<header class="top">
  <h1>🗓️ Venue Rota Maker</h1>
  <div class="row no-print">
    <button class="btn secondary small" id="weekPrev">◀ Prev week</button>
    <span id="weekLabel" style="font-weight:700;font-size:13px;"></span>
    <button class="btn secondary small" id="weekNext">Next week ▶</button>
    <button class="btn small" id="installBtn" style="display:none">⬇️ Install app</button>
  </div>
</header>
<nav class="tabs no-print">
  <button data-tab="rota" class="active">Weekly Rota</button>
  <button data-tab="dept">By Location</button>
  <button data-tab="staff">Staff</button>
  <button data-tab="shifts">Shift Templates</button>
  <button data-tab="rules">Staffing Rules</button>
  <button data-tab="bookings">M&E Bookings</button>
  <button data-tab="data">Export / Import</button>
</nav>
<main id="app"></main>

<button id="chatFab" title="Ask the rota assistant">💬</button>
<div id="chatPanel">
  <div id="chatHead">Rota Assistant <span style="cursor:pointer;color:#888" id="chatClose">✕</span></div>
  <div id="chatMsgs"></div>
  <div class="hint-chips" id="chatHints"></div>
  <div id="chatInputRow">
    <input id="chatInput" placeholder="e.g. what's on this week?" />
    <button class="btn small" id="chatSend">Send</button>
  </div>
</div>

<script>
(function(){
"use strict";
const DAYS=["mon","tue","wed","thu","fri","sat","sun"];
const DAY_LABEL={mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday",sun:"Sunday"};
const DEPTS=["breakfast","me","pub"];
const DEPT_LABEL={breakfast:"Breakfast",pub:"P&G",me:"M&E"};
const TEAMS=[{key:"management",label:"F&B Management Team"},{key:"team",label:"F&B Team"}];
const MARKS=["REQ OFF","HOL","ADMIN","VP","UNI","SICK","x"];
const INFO_GROUPS=[
  {label:"Sport",cls:"ig-sport",rows:[{key:"football",label:"Football",sport:true},{key:"otherSport",label:"Other sport",sport:true}]},
  {label:"F&B",cls:"ig-fb",rows:[
    {key:"lunch",label:"Lunch info"},
    {key:"dinner",label:"Dinner info"},
    {key:"theme",label:"Ate Day's a Week",repeat:true},
    {key:"fbNotes",label:"Notes"},
    {key:"coreInc",label:"Core incentives",span:true,repeat:true},
    {key:"weekInc",label:"This week's incentives",span:true}
  ]},
  {label:"M&E",cls:"ig-me",rows:[{key:"conf",label:"Conf info"},{key:"event",label:"Event info",auto:"bookings"},{key:"meNotes",label:"Notes"}]},
  {label:"",cls:"ig-gen",rows:[{key:"security",label:"Security"},{key:"general",label:"General notes"}]}
];
const STORE_KEY="venueRotaData_v2";

function uid(){return Math.random().toString(36).slice(2,10);}
function pad(n){return n<10?"0"+n:""+n;}
function toMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function fmtDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseDate(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function mondayOf(dateStr){
  const d=parseDate(dateStr);
  const dow=(d.getDay()+6)%7; // 0=mon
  d.setDate(d.getDate()-dow);
  return fmtDate(d);
}
function addDays(dateStr,n){const d=parseDate(dateStr);d.setDate(d.getDate()+n);return fmtDate(d);}
function dayNameOf(dateStr){const d=parseDate(dateStr);return DAYS[(d.getDay()+6)%7];}
function niceDate(dateStr){const d=parseDate(dateStr);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function ordinal(n){const s=(n%100>=11&&n%100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th");return n+s;}
function dayHeading(dateStr){const d=parseDate(dateStr);const day=ordinal(d.getDate());return d.getDate()===1?day+" "+d.toLocaleDateString('en-GB',{month:'long'}):day;}

// ---------- Defaults ----------
function defaultData(){
  return {
    staff: defaultStaff(),
    shiftTemplates: defaultTemplates(),
    busyness: defaultBusyness(),
    defaultBusynessByDay: defaultBusynessByDay(),
    bookings: sampleBookings(),
    infoDefaults: defaultInfo(),
    weeks: {},
    chatLog: []
  };
}

function defaultTemplates(){
  const wk=["mon","tue","wed","thu","fri"], we=["sat","sun"], all=DAYS.slice();
  return {
    breakfast:[
      {id:uid(),name:"Breakfast Open",start:"06:30",end:"12:00",days:wk},
      {id:uid(),name:"Breakfast Open",start:"07:00",end:"12:00",days:we},
      {id:uid(),name:"Breakfast Lead",start:"06:00",end:"15:00",days:wk,fixedStaff:1},
      {id:uid(),name:"Breakfast Lead",start:"07:00",end:"16:00",days:we,fixedStaff:1}
    ],
    pub:[
      {id:uid(),name:"P&G Day",start:"12:00",end:"18:00",days:all},
      {id:uid(),name:"P&G Evening",start:"18:00",end:"23:00",days:all},
      {id:uid(),name:"P&G Close",start:"18:00",end:"00:30",days:["mon","tue","wed","thu","sun"],fixedStaff:2},
      {id:uid(),name:"P&G Late Close",start:"18:00",end:"01:30",days:["fri","sat"],fixedStaff:2}
    ],
    me:[
      {id:uid(),name:"Meeting Rooms",start:"08:00",end:"18:00",days:wk,fixedStaff:1}
    ]
  };
}
function defaultBusyness(){
  return {
    breakfast:{quiet:{total:2},normal:{total:2},busy:{total:3},veryBusy:{total:4}},
    pub:{quiet:{total:2,bar:1},normal:{total:3,bar:1},busy:{total:4,bar:2},veryBusy:{total:5,bar:2}},
    me:{ratioPerGuest:15,min:2}
  };
}
function defaultBusynessByDay(){
  return {
    breakfast:{mon:"normal",tue:"normal",wed:"normal",thu:"normal",fri:"normal",sat:"busy",sun:"busy"},
    pub:{mon:"normal",tue:"normal",wed:"normal",thu:"normal",fri:"busy",sat:"veryBusy",sun:"quiet"}
  };
}
function defaultInfo(){
  return {
    theme:{mon:"Just Wing It",tue:"Taco Tuesdays",wed:"Steak It Easy",thu:"Feast From The East",fri:"Burger Me / Oh My Cod",sat:"Soul Tribute Night",sun:"Get Stuffed Sunday Lunch"},
    coreInc:"(Reward Points) 1. Guest Mentions = £5, 2. MG 100% Score = £10, 3. Weekly Darts Sales = £10, 4. F&B Team Member of the Month = £25"
  };
}
function defaultStaff(){
  // name, locations (b=Breakfast, m=M&E, p=P&G), young person
  const mgmt=[["Richard","mp"],["Aude","pm"],["Catherine","mpb"],["Bianka","pm"],["Samantha","b"],["Kayleigh","m"],["Berri","pm"],["Milly","p"],["Sonal","mp"],["Luke","p"],["Sadie","p"],["DJ","p"],["Ashley","p"],["Lily","m"]];
  const team=[["Alexandra Fife","p"],["Alexia Akre","p"],["Amelia Turner-Berry","m"],["Becky Wagner","b"],["Candice White","p"],["Chloe Mercer-Bambrick","p"],["Ciara Murphy","bp"],["Cody Faulkner","p"],["Conor Rhodes","p"],["Dylan Bharj","m"],["Elliott Pratt","m"],["Elly Griffin","mp"],["Evan McEnery","p"],["Eve Cannon","p"],["Finley McDonnell","p"],["Freddie Pooler","p"],["Isabella Wilcox","m"],["Jack Horsfield-Wykes","bm"],["Jade Coen","p"],["James McNally","pm"],["Kellon Upton","pm"],["Kris Roscoe","p"],["Lauren Convey","b",true],["Lindsay Powell","bp"],["Lucia Chapman","b"],["Lola Pooler","m",true],["Naeya Goodall","p"],["Oli Flassam","p"],["Rosie Johnson","pm"],["Sasha Moriwandi","p"],["Sophie Wagner","p"],["Sydney Hooper","pb"],["Theetso Wells","p"],["Thomas Munnelly","p"],["Tia O'Brien","p"],["Vanessa Boafo","p"]];
  const map={b:"breakfast",m:"me",p:"pub"};
  const mk=(row,teamKey)=>{
    const depts=row[1].split("").map(c=>map[c]);
    const yp=!!row[2];
    return {id:uid(),name:row[0],team:teamKey,departments:depts,primary:depts[0],barTrained:depts.includes("pub")&&!yp,skills:[],
      contractedHours:teamKey==="management"?40:16,maxHours:teamKey==="management"?48:40,under18:yp,unavailability:[],holidays:[]};
  };
  return mgmt.map(r=>mk(r,"management")).concat(team.map(r=>mk(r,"team")));
}
function sampleBookings(){
  const wk=mondayOf(fmtDate(new Date()));
  return [
    {id:uid(),name:"Wedding - Smith party",date:addDays(wk,5),start:"18:00",end:"23:30",guests:90},
    {id:uid(),name:"Birthday party",date:addDays(wk,6),start:"19:00",end:"23:00",guests:40}
  ];
}

// Fill in anything older saved data is missing
function migrate(d){
  d=d||{};
  d.staff=d.staff||[];
  d.staff.forEach(p=>{
    if(!p.team) p.team="team";
    p.departments=p.departments||[]; p.skills=p.skills||[];
    p.unavailability=p.unavailability||[]; p.holidays=p.holidays||[];
  });
  d.shiftTemplates=d.shiftTemplates||defaultTemplates();
  DEPTS.forEach(k=>{d.shiftTemplates[k]=d.shiftTemplates[k]||[];});
  d.busyness=d.busyness||defaultBusyness();
  d.defaultBusynessByDay=d.defaultBusynessByDay||defaultBusynessByDay();
  d.bookings=d.bookings||[];
  d.infoDefaults=d.infoDefaults||defaultInfo();
  d.weeks=d.weeks||{};
  Object.values(d.weeks).forEach(fixWeek);
  d.chatLog=d.chatLog||[];
  return d;
}
function fixWeek(w){
  w.shifts=w.shifts||[];
  w.marks=w.marks||{};
  w.info=w.info||{};
  w.infoSpan=w.infoSpan||{};
  w.shifts.forEach(s=>{s.assigned=s.assigned||[];s.notes=s.notes||{};});
  return w;
}

let data=load();
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  const d=defaultData();
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(d)); }catch(e){}
  return d;
}
function save(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(data)); }catch(e){} }

let currentWeekStart=mondayOf(fmtDate(new Date()));
let currentTab="rota";

// ---------- Week / shift generation ----------
function newWeek(weekStart){ return fixWeek({shifts:buildShiftsForWeek(weekStart),generated:false}); }
function getWeek(weekStart,ensure=true){
  if(!data.weeks[weekStart] && ensure){
    data.weeks[weekStart]=newWeek(weekStart);
    save();
  }
  return data.weeks[weekStart];
}

function buildShiftsForWeek(weekStart){
  const shifts=[];
  DAYS.forEach((day,i)=>{
    const date=addDays(weekStart,i);
    ["breakfast","pub","me"].forEach(dept=>{
      data.shiftTemplates[dept].forEach(t=>{
        if(t.days.includes(day)) shifts.push(makeShift(dept,t,day,date));
      });
    });
  });
  data.bookings.forEach(b=>{
    if(b.date>=weekStart && b.date<=addDays(weekStart,6)){
      shifts.push({
        id:uid(),dept:"me",name:b.name,day:dayNameOf(b.date),date:b.date,start:b.start,end:b.end,
        busynessLevel:null,bookingId:b.id,guests:b.guests,
        assigned:[],notes:{},locked:false,templateId:null
      });
    }
  });
  return shifts;
}

function makeShift(dept,t,day,date){
  return {
    id:uid(),dept,name:t.name,day,date,start:t.start,end:t.end,
    busynessLevel: dept==="me"?null:(data.defaultBusynessByDay[dept][day]||"normal"),
    assigned:[],notes:{},locked:false,templateId:t.id,fixedStaff:t.fixedStaff||t.maxNeeded||null,
    closeLabel:!!t.closeLabel
  };
}
function shiftKey(sh){ return (sh.templateId||("b:"+sh.bookingId))+"|"+sh.day; }

function shiftHours(sh){
  let mins=toMin(sh.end)-toMin(sh.start);
  if(mins<=0) mins+=1440;
  return mins/60;
}
function shiftRequirement(sh){
  if(sh.extra) return {total:0,bar:0};
  if(sh.bookingId){
    const need=Math.max(data.busyness.me.min,Math.ceil(sh.guests/data.busyness.me.ratioPerGuest));
    return {total:need,bar:0};
  }
  if(sh.fixedStaff) return {total:sh.fixedStaff,bar:sh.dept==="pub"?Math.min(1,sh.fixedStaff):0};
  if(sh.dept==="me") return {total:1,bar:0};
  const lvl=sh.busynessLevel||"normal";
  const conf=data.busyness[sh.dept][lvl]||{total:1};
  return {total:conf.total, bar:sh.dept==="pub"?(conf.bar||0):0};
}
function shiftText(sh,pid){
  const note=(pid&&sh.notes&&sh.notes[pid])||sh.label||"";
  return sh.start+" - "+(sh.closeLabel?"Close":sh.end)+(note?" "+note:"");
}

// minutes-from-week-start (mon 00:00 = 0)
function shiftAbsRange(sh){
  const dayIdx=DAYS.indexOf(sh.day);
  let s=dayIdx*1440+toMin(sh.start);
  let e=dayIdx*1440+toMin(sh.end);
  if(e<=s) e+=1440;
  return [s,e];
}
function staffAssignedShifts(staffId,week){
  return week.shifts.filter(s=>s.assigned.includes(staffId));
}
function isOnHoliday(person,date){
  return (person.holidays||[]).some(h=>date>=h.start && date<=h.end);
}
function getMark(week,person,day){
  const m=(week.marks[person.id]||{})[day];
  if(m) return m;
  const date=addDays(currentWeekStartOf(week),DAYS.indexOf(day));
  return isOnHoliday(person,date)?"HOL":"";
}
function currentWeekStartOf(week){
  for(const k in data.weeks){ if(data.weeks[k]===week) return k; }
  return currentWeekStart;
}
function setMark(week,pid,day,val){
  week.marks[pid]=week.marks[pid]||{};
  if(val) week.marks[pid][day]=val; else delete week.marks[pid][day];
  if(!val) return;
  // someone off that day comes off that day's shifts
  week.shifts.filter(s=>s.day===day && s.assigned.includes(pid)).forEach(s=>{
    s.assigned=s.assigned.filter(x=>x!==pid);
    if(s.notes) delete s.notes[pid];
    reEvalShift(s,false);
  });
  week.shifts=week.shifts.filter(s=>!(s.extra && !s.assigned.length));
}
function isUnavailable(person,sh){
  // Unavailability windows are per weekday; check the shift's part on its own day
  // and any part that runs past midnight into the next day.
  const [s,e]=shiftAbsRange(sh);
  return (person.unavailability||[]).some(u=>{
    const di=DAYS.indexOf(u.day);
    const uS=di*1440+toMin(u.start||"00:00"), uE=di*1440+toMin(u.end||"23:59")+1;
    // Monday windows also apply to overnight Sunday shifts running into next week
    const hit=(a,b)=>a<e && b>s;
    return hit(uS,uE) || (di===0 && hit(uS+7*1440,uE+7*1440));
  });
}

function canAssign(person,sh,week){
  if(!person.departments.includes(sh.dept)) return {ok:false,reason:"not trained for "+DEPT_LABEL[sh.dept]};
  const mark=getMark(week,person,sh.day);
  if(mark) return {ok:false,reason:mark==="HOL"?"on holiday":"marked "+mark};
  if(isUnavailable(person,sh)) return {ok:false,reason:"marked unavailable"};
  const already=staffAssignedShifts(person.id,week);
  const [s1,e1]=shiftAbsRange(sh);
  for(const other of already){
    if(other.id===sh.id) continue;
    const [s2,e2]=shiftAbsRange(other);
    if(s1<e2 && s2<e1) return {ok:false,reason:"already on a shift that overlaps"};
    const gap = s1>=e2 ? s1-e2 : (s2>=e1? s2-e1 : -1);
    if(gap>=0 && gap<11*60) return {ok:false,reason:"less than 11 hours rest from another shift"};
  }
  const currentHours=already.reduce((sum,s)=>sum+shiftHours(s),0);
  if(currentHours+shiftHours(sh) > person.maxHours) return {ok:false,reason:"would exceed max weekly hours"};
  if(person.under18 && shiftHours(sh)>8) return {ok:false,reason:"under-18: shift too long"};
  return {ok:true};
}

function isLateShift(sh){ return toMin(sh.end)<=360 || toMin(sh.start)>=1020; }
function candidateScore(person,sh,week){
  const already=staffAssignedShifts(person.id,week);
  const currentHours=already.reduce((s,x)=>s+shiftHours(x),0);
  // share of contract filled after this shift: whoever is furthest below their contract goes first
  let score=(currentHours+shiftHours(sh))/Math.max(person.contractedHours||0,4);
  if(person.primary!==sh.dept) score+=0.25;
  if(isLateShift(sh)) score+=(person._lateCount||0)*0.05;
  if(sh.day==="sat"||sh.day==="sun") score+=(person._weekendCount||0)*0.05;
  return score;
}

// Rebuild the week's shift list from the current templates and bookings,
// keeping locked shifts, custom shifts, busyness choices and notes.
function refreshShiftList(weekStart){
  const old=getWeek(weekStart);
  const byKey={};
  old.shifts.forEach(s=>{ if(!s.extra) byKey[shiftKey(s)]=s; });
  const fresh=buildShiftsForWeek(weekStart).map(sh=>{
    const prev=byKey[shiftKey(sh)];
    if(!prev) return sh;
    if(prev.locked) return prev;
    sh.id=prev.id; sh.busynessLevel=prev.busynessLevel||sh.busynessLevel; sh.notes=prev.notes||{}; sh.assigned=prev.assigned;
    return sh;
  });
  old.shifts=fresh.concat(old.shifts.filter(s=>s.extra));
  return old;
}

function regenerateWeek(weekStart){
  const week=refreshShiftList(weekStart);
  data.staff.forEach(p=>{p._lateCount=0;p._weekendCount=0;});
  // clear everything we're about to fill so old assignments don't block anyone
  week.shifts.forEach(sh=>{ if(!sh.locked && !sh.extra){ sh.assigned=[]; sh.warnings=[]; } });
  week.shifts.forEach(sh=>{ if(sh.locked||sh.extra) sh.assigned.forEach(id=>{const p=data.staff.find(x=>x.id===id); if(p) bumpCounters(p,sh);}); });
  const order=week.shifts.slice().sort((a,b)=>shiftRequirement(b).total-shiftRequirement(a).total);
  const byId=id=>data.staff.find(x=>x.id===id);
  order.forEach(sh=>{
    if(sh.locked||sh.extra) return;
    const req=shiftRequirement(sh);
    let pool=data.staff.filter(p=>canAssign(p,sh,week).ok);
    if(req.bar>0){
      const barPool=pool.filter(p=>p.barTrained).sort((a,b)=>candidateScore(a,sh,week)-candidateScore(b,sh,week));
      for(const p of barPool){
        if(sh.assigned.filter(id=>byId(id).barTrained).length>=req.bar) break;
        if(sh.assigned.length>=req.total) break;
        sh.assigned.push(p.id); bumpCounters(p,sh);
      }
    }
    pool=pool.filter(p=>!sh.assigned.includes(p.id)).sort((a,b)=>candidateScore(a,sh,week)-candidateScore(b,sh,week));
    for(const p of pool){
      if(sh.assigned.length>=req.total) break;
      sh.assigned.push(p.id); bumpCounters(p,sh);
    }
    reEvalShift(sh,false);
  });
  week.generated=true;
  save();
  return week;
}
function bumpCounters(p,sh){
  if(isLateShift(sh)) p._lateCount=(p._lateCount||0)+1;
  if(sh.day==="sat"||sh.day==="sun") p._weekendCount=(p._weekendCount||0)+1;
}

function copyLastWeek(weekStart){
  const prevWeek=data.weeks[addDays(weekStart,-7)];
  if(!prevWeek){ alertMsg("No previous week saved yet."); return; }
  const week=newWeek(weekStart);
  const live=id=>data.staff.some(s=>s.id===id);
  week.shifts.forEach(sh=>{
    const match=prevWeek.shifts.find(p=>!p.extra && p.dept===sh.dept && p.name===sh.name && p.day===sh.day && p.start===sh.start);
    if(match){ sh.assigned=match.assigned.filter(live); sh.busynessLevel=match.busynessLevel; sh.notes=Object.assign({},match.notes||{}); }
  });
  prevWeek.shifts.filter(s=>s.extra).forEach(s=>{
    const c=JSON.parse(JSON.stringify(s));
    c.id=uid(); c.date=addDays(weekStart,DAYS.indexOf(s.day)); c.assigned=c.assigned.filter(live);
    if(c.assigned.length) week.shifts.push(c);
  });
  week.shifts.forEach(sh=>reEvalShift(sh,false));
  data.weeks[weekStart]=week;
  save();
  render();
}

// ---------- UI shell ----------
function el(tag,attrs,children){
  const e=document.createElement(tag);
  attrs=attrs||{};
  Object.keys(attrs).forEach(k=>{
    if(attrs[k]===undefined||attrs[k]===null||attrs[k]===false) return;
    if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  });
  (children||[]).forEach(c=>{ if(c!==null&&c!==undefined&&c!==false) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function alertMsg(m){ window.alert(m); }
function markCls(m){ return "m-"+String(m).replace(/[^A-Za-z]/g,""); }

document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    currentTab=b.dataset.tab;
    document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render();
  });
});

document.getElementById("weekNext").addEventListener("click",()=>{currentWeekStart=addDays(currentWeekStart,7);render();});

function render(){
  document.getElementById("weekLabel").textContent = niceDate(currentWeekStart)+" – "+niceDate(addDays(currentWeekStart,6));
  const app=document.getElementById("app");
  app.innerHTML="";
  if(currentTab==="rota") app.appendChild(renderRota());
  else if(currentTab==="dept") app.appendChild(renderByDept());
  else if(currentTab==="staff") app.appendChild(renderStaff());
  else if(currentTab==="shifts") app.appendChild(renderShiftTemplates());
  else if(currentTab==="rules") app.appendChild(renderRules());
  else if(currentTab==="bookings") app.appendChild(renderBookings());

}

      tr.appendChild(el("td",{class:"name"},[person.name+(person.under18?" (YP)":"")]));

      } else {

function infoGet(week,row,day){
  if(row.repeat) return row.span?(data.infoDefaults[row.key]||""):((data.infoDefaults[row.key]||{})[day]||"");
  return row.span?(week.infoSpan[row.key]||""):((week.info[row.key]||{})[day]||"");
}
function infoSet(week,row,day,val){
  if(row.repeat){
    if(row.span) data.infoDefaults[row.key]=val;
    else { data.infoDefaults[row.key]=data.infoDefaults[row.key]||{}; data.infoDefaults[row.key][day]=val; }
  } else if(row.span) week.infoSpan[row.key]=val;
  else { week.info[row.key]=week.info[row.key]||{}; week.info[row.key][day]=val; }
  save();
}
function infoCell(week,row,day,colspan){
  const td=el("td",{class:"info",colspan});
  if(row.auto==="bookings" && day){
    const date=addDays(currentWeekStart,DAYS.indexOf(day));
    const bks=data.bookings.filter(b=>b.date===date);
    if(bks.length) td.appendChild(el("div",{class:"auto"},[bks.map(b=>`${b.name} ${b.start}-${b.end} (${b.guests})`).join("\n")]));
  }
  const ed=el("div",{class:"ed"+(row.sport?" sport":""),contenteditable:"true",title:row.repeat?"Repeats every week":"This week only"});
  ed.textContent=infoGet(week,row,day);
  ed.addEventListener("blur",()=>infoSet(week,row,day,ed.innerText.replace(/\n+$/,"")));
  td.appendChild(ed);
  return td;
}

// ---------- Cell editor (one person, one day) ----------
function openCellModal(pid,day){
  const week=getWeek(currentWeekStart);
  const p=data.staff.find(x=>x.id===pid);
  if(!p) return;
  const date=addDays(currentWeekStart,DAYS.indexOf(day));
  const reopen=()=>{ render(); closeModals(); openCellModal(pid,day); };
  const bg=el("div",{class:"modal-bg",onclick:(e)=>{if(e.target===bg)bg.remove();}});
  const modal=el("div",{class:"modal"});
  modal.appendChild(el("span",{class:"closeX",onclick:()=>bg.remove()},["✕"]));
  modal.appendChild(el("h3",{},[p.name+(p.under18?" (YP)":"")]));
  modal.appendChild(el("div",{class:"small-muted"},[DAY_LABEL[day]+" "+dayHeading(date)+" · "+p.departments.map(d=>DEPT_LABEL[d]).join(", ")]));

  // current shifts
  modal.appendChild(el("h4",{},["Shifts"]));
  const mine=week.shifts.filter(s=>s.day===day && s.assigned.includes(pid)).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if(!mine.length) modal.appendChild(el("div",{class:"small-muted"},["Not working."]));
  mine.forEach(sh=>{
    const note=el("input",{placeholder:"note e.g. Close Set Up",style:"width:150px",value:(sh.notes&&sh.notes[pid])||(sh.extra?sh.label||"":"")});
    note.addEventListener("change",()=>{
      if(sh.extra) sh.label=note.value.trim();
      else { sh.notes=sh.notes||{}; if(note.value.trim()) sh.notes[pid]=note.value.trim(); else delete sh.notes[pid]; }
      save(); reopen();
    });
    modal.appendChild(el("div",{class:"shift-line"},[
      el("span",{class:"swatch "+sh.dept}),
      el("strong",{},[sh.start+" - "+(sh.closeLabel?"Close":sh.end)]),
      el("span",{class:"small-muted"},[DEPT_LABEL[sh.dept]+(sh.extra?"":" · "+sh.name)]),
      note,
      sh.extra?null:el("button",{class:"btn small secondary",onclick:()=>{bg.remove();openShiftModal(sh.id);}},["shift details"]),
      el("button",{class:"btn small secondary",onclick:()=>{
        sh.assigned=sh.assigned.filter(x=>x!==pid);
        if(sh.notes) delete sh.notes[pid];
        if(sh.extra && !sh.assigned.length) week.shifts=week.shifts.filter(s=>s!==sh);
        reEvalShift(sh); reopen();
      }},["remove"])
    ]));
  });

  // day status
  modal.appendChild(el("h4",{},["Day status"]));
  const explicit=(week.marks[pid]||{})[day]||"";
  const statusSel=el("select",{});
  [""].concat(MARKS).forEach(m=>statusSel.appendChild(el("option",{value:m,selected:m===explicit?"selected":undefined},[m||"— none —"])));
  statusSel.addEventListener("change",()=>{ setMark(week,pid,day,statusSel.value); save(); reopen(); });
  modal.appendChild(el("div",{class:"row"},[
    statusSel,
    el("button",{class:"btn small secondary",onclick:()=>{ DAYS.forEach(d=>setMark(week,pid,d,statusSel.value)); save(); reopen(); }},["Apply to whole week"])
  ]));
  if(!explicit && isOnHoliday(p,date)) modal.appendChild(el("div",{class:"small-muted"},["On holiday (from the Staff tab)."]));

  // join a planned shift
  const planned=week.shifts.filter(s=>s.day===day && !s.extra && !s.assigned.includes(pid) && p.departments.includes(s.dept));
  if(planned.length){
    modal.appendChild(el("h4",{},["Add to a planned shift"]));
    const sel=el("select",{style:"max-width:100%"});
    planned.forEach(s=>{
      const c=canAssign(p,s,week), req=shiftRequirement(s);
      sel.appendChild(el("option",{value:s.id,disabled:c.ok?undefined:"disabled"},[`${DEPT_LABEL[s.dept]} ${s.name} ${s.start}-${s.end} (${s.assigned.length}/${req.total})`+(c.ok?"":" — "+c.reason)]));
    });
    modal.appendChild(el("div",{class:"row"},[sel,el("button",{class:"btn small",onclick:()=>{
      const s=week.shifts.find(x=>x.id===sel.value); if(!s) return;
      if(!canAssign(p,s,week).ok) return;
      s.assigned.push(pid); reEvalShift(s); reopen();
    }},["Add"])]));
  }

  // custom shift
  modal.appendChild(el("h4",{},["Add a custom shift"]));
  const loc=el("select",{});
  DEPTS.forEach(d=>loc.appendChild(el("option",{value:d,selected:d===(p.primary||p.departments[0])?"selected":undefined},[DEPT_LABEL[d]])));
  const st=el("input",{type:"time",value:"17:00"}), en=el("input",{type:"time",value:"23:00"});
  const closeCb=el("input",{type:"checkbox"});
  const lbl=el("input",{placeholder:"note e.g. DM, Set Up, open hub",style:"width:170px"});
  modal.appendChild(el("div",{class:"row"},[loc,st,el("span",{},["to"]),en]));
  modal.appendChild(el("div",{class:"row",style:"margin-top:6px"},[
    el("label",{style:"display:flex;gap:4px;align-items:center;color:var(--ink)"},[closeCb,"show end as \"Close\""]),
    lbl,
    el("button",{class:"btn small",onclick:()=>{
      if(!st.value||!en.value) return;
      const sh={id:uid(),dept:loc.value,name:"Custom",day,date,start:st.value,end:en.value,busynessLevel:null,
        assigned:[],notes:{},locked:false,templateId:null,extra:true,label:lbl.value.trim(),closeLabel:closeCb.checked};
      const c=canAssign(p,sh,week);
      if(!c.ok && !confirm(`${p.name}: ${c.reason}. Add anyway?`)) return;
      sh.assigned.push(pid); week.shifts.push(sh); save(); reopen();

function openShiftModal(shiftId){

  if(!sh) return;
  const req=shiftRequirement(sh);
  const bg=el("div",{class:"modal-bg",onclick:(e)=>{if(e.target===bg)bg.remove();}});
  const modal=el("div",{class:"modal"});
  modal.appendChild(el("span",{class:"closeX",onclick:()=>bg.remove()},["✕"]));

  if(sh.warnings&&sh.warnings.length){
    modal.appendChild(el("div",{class:"warnbox",style:"margin-top:8px"},[el("ul",{},sh.warnings.map(w=>el("li",{},[w])))]));
  }
  let busyCtl;
  if(sh.bookingId) busyCtl=el("span",{class:"small-muted"},["set by guest ratio ("+sh.guests+" guests)"]);
  else if(sh.fixedStaff) busyCtl=el("span",{class:"small-muted"},["fixed at "+sh.fixedStaff+" staff (Shift Templates tab)"]);
  else if(sh.dept==="me") busyCtl=el("span",{class:"small-muted"},["1 staff"]);
  else busyCtl=dropdown(["quiet","normal","busy","veryBusy"],sh.busynessLevel,v=>{sh.busynessLevel=v;reEvalShift(sh);renderAndReopen(sh.id);});
  modal.appendChild(el("div",{class:"field",style:"margin-top:8px"},[el("label",{},["Busyness"]),busyCtl]));
  modal.appendChild(el("h4",{},["Assigned"]));
  const list=el("div",{class:"pillrow"});
  sh.assigned.forEach(id=>{
    const p=data.staff.find(x=>x.id===id);
    list.appendChild(el("span",{class:"pill"},[
      (p?p.name:"?")+" ",
      el("button",{class:"btn small secondary",style:"margin-left:4px",onclick:()=>{sh.assigned=sh.assigned.filter(x=>x!==id);reEvalShift(sh);renderAndReopen(sh.id);}},["remove"])
    ]));
  });
  if(!sh.assigned.length) list.appendChild(el("span",{class:"small-muted"},["Nobody yet."]));
  modal.appendChild(list);
  modal.appendChild(el("h4",{},["Add / swap in"]));
  const sel=el("select",{style:"max-width:100%"});
  data.staff.filter(p=>!sh.assigned.includes(p.id)).map(p=>({p,c:canAssign(p,sh,week)}))
    .sort((a,b)=>(b.c.ok-a.c.ok)||a.p.name.localeCompare(b.p.name))
    .forEach(({p,c})=>sel.appendChild(el("option",{value:p.id,disabled:c.ok?undefined:"disabled"},[p.name+(c.ok?"":" — "+c.reason)])));
  modal.appendChild(sel);
  modal.appendChild(el("button",{class:"btn small",style:"margin-left:6px",onclick:()=>{
    const id=sel.value; if(!id) return;
    const p=data.staff.find(x=>x.id===id);
    if(!p||!canAssign(p,sh,week).ok) return;
    sh.assigned.push(id); reEvalShift(sh); renderAndReopen(sh.id);
  }},["Add"]));
  modal.appendChild(el("div",{class:"row",style:"margin-top:14px"},[
    el("button",{class:"btn "+(sh.locked?"secondary":""),onclick:()=>{sh.locked=!sh.locked;save();renderAndReopen(sh.id);}},[sh.locked?"🔓 Unlock shift":"🔒 Lock shift"]),
    el("button",{class:"btn secondary",onclick:()=>bg.remove()},["Close"])
  ]));
  bg.appendChild(modal);
  document.body.appendChild(bg);
}
function reEvalShift(sh,doSave){
  const req=shiftRequirement(sh);
  sh.warnings=[];
  const barCount=sh.assigned.filter(id=>{const p=data.staff.find(x=>x.id===id); return p&&p.barTrained;}).length;
  if(sh.assigned.length<req.total) sh.warnings.push(`Needs ${req.total} staff, only ${sh.assigned.length} assigned.`);
  if(req.bar>0 && barCount<req.bar) sh.warnings.push(`Needs ${req.bar} bar-trained staff, only ${barCount} assigned.`);
  if(doSave!==false) save();
}

function fileInput(){
  return el("input",{type:"file",accept:"application/json",style:"display:none",onchange:(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{ data=migrate(JSON.parse(reader.result)); save(); render(); alertMsg("Imported."); }
      catch(err){ alertMsg("Could not read that file."); }
    };
    reader.readAsText(f);
  }});
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="venue-rota-backup.json";
  a.click();
}
function buildWhatsAppText(staffId){
  const week=getWeek(currentWeekStart);
  const p=data.staff.find(x=>x.id===staffId);
  if(!p) return "";
  const lines=[`${p.name}'s shifts — ${niceDate(currentWeekStart)} to ${niceDate(addDays(currentWeekStart,6))}`];
  let total=0;
  DAYS.forEach(day=>{
    const shs=week.shifts.filter(s=>s.day===day && s.assigned.includes(p.id)).sort((a,b)=>toMin(a.start)-toMin(b.start));
    shs.forEach(sh=>{ total+=shiftHours(sh); lines.push(`${DAY_LABEL[day]}: ${DEPT_LABEL[sh.dept]} ${shiftText(sh,p.id)}`); });
    const m=getMark(week,p,day);
    if(m) lines.push(`${DAY_LABEL[day]}: ${m}`);
  });
  lines.push(`Total: ${total.toFixed(1)} hours`);
  return lines.join("\n");
}

function findStaffByName(text){
  const t=text.toLowerCase();
  let best=null;
  data.staff.forEach(p=>{
    const n=p.name.toLowerCase();
    if(t.includes(n)) { if(!best||n.length>best.name.toLowerCase().length) best=p; return; }
    const first=n.split(" ")[0];
    if(first.length>1 && new RegExp("\\b"+first.replace(/[^a-z]/g,"")+"\\b").test(t)){ if(!best) best=p; }
  });
  return best;
}
function findDept(text){
  const t=text.toLowerCase();
  if(t.includes("breakfast")) return "breakfast";
  if(t.includes("p&g")||t.includes("pub")||t.includes("bar")) return "pub";
  if(t.includes("event")||t.includes("meeting")||t.includes("m&e")) return "me";
  return null;
}
function findDay(text){
  const t=text.toLowerCase();
  if(t.includes("today")) return dayNameOf(fmtDate(new Date()));
  if(t.includes("tomorrow")) return dayNameOf(addDays(fmtDate(new Date()),1));
  for(const d of DAYS){ if(t.includes(DAY_LABEL[d].toLowerCase())||new RegExp("\\b"+d+"\\b").test(t)) return d; }
  return null;
}
function namesOf(ids){ return ids.map(id=>data.staff.find(p=>p.id===id)?.name).filter(Boolean).join(", "); }
function handleChat(text){
  const t=text.toLowerCase();
  const week=getWeek(currentWeekStart);
  if(t.includes("generate")){
    regenerateWeek(currentWeekStart); render();
    return "Done — I've generated the rota for this week. Shifts I couldn't fully cover have a red edge.";
  }
  if(t.includes("what's on")||t.includes("whats on")||t.includes("what is on")){
    const day=findDay(text);
    if(day){
      const shs=week.shifts.filter(s=>s.day===day);
      if(!shs.length) return `Nothing scheduled for ${DAY_LABEL[day]} yet — try "generate the rota" first.`;
      return `${DAY_LABEL[day]}:\n`+shs.map(s=>`• ${DEPT_LABEL[s.dept]} ${s.name} ${s.start}-${s.end}: ${namesOf(s.assigned)||"nobody assigned yet"}`).join("\n");
    }
    const warn=week.shifts.filter(s=>s.warnings&&s.warnings.length).length;
    return `This week (${niceDate(currentWeekStart)}–${niceDate(addDays(currentWeekStart,6))}) has ${week.shifts.length} shifts across Breakfast, P&G and M&E.${warn?` ${warn} shift(s) have coverage problems — ask me "why is X short".`:" All shifts are fully covered."}`;
  }
  if(t.includes("why") && (t.includes("short")||t.includes("red")||t.includes("problem"))){
    const day=findDay(text), dept=findDept(text);
    let shs=week.shifts.filter(s=>s.warnings&&s.warnings.length);
    if(day) shs=shs.filter(s=>s.day===day);
    if(dept) shs=shs.filter(s=>s.dept===dept);
    if(!shs.length) return "I don't see any coverage problems matching that — looks like everything's covered.";
    return shs.map(s=>`${DAY_LABEL[s.day]} ${DEPT_LABEL[s.dept]} (${s.name}): ${s.warnings.join(" ")}`).join("\n");
  }
  if(t.includes("who's free")||t.includes("who is free")||t.includes("who's available")){
    const day=findDay(text)||dayNameOf(fmtDate(new Date()));
    const free=data.staff.filter(p=>!getMark(week,p,day) && !week.shifts.some(s=>s.day===day && s.assigned.includes(p.id)));
    return free.length? `Free on ${DAY_LABEL[day]}: `+free.map(p=>p.name).join(", ") : `Everyone seems booked on ${DAY_LABEL[day]}.`;
  }
  if(t.includes("who's working")||t.includes("who is working")||t.includes("who's on")||t.includes("who is on")){
    const day=findDay(text), dept=findDept(text);
    let shs=week.shifts;
    if(day) shs=shs.filter(s=>s.day===day);
    if(dept) shs=shs.filter(s=>s.dept===dept);
    if(!shs.length) return "I couldn't find matching shifts — try naming a day and/or location.";
    return shs.map(s=>`${DAY_LABEL[s.day]} ${DEPT_LABEL[s.dept]} ${s.name} (${s.start}-${s.end}): `+(namesOf(s.assigned)||"nobody yet")).join("\n");
  }
  if(/\b(move|swap|add|remove)\b/.test(t)){
    const person=findStaffByName(text), day=findDay(text), dept=findDept(text);
    if(!person) return "I couldn't tell which staff member you mean — try using their first name.";
    if(!day) return "Which day should I do that for?";
    if(/\bremove\b/.test(t)){
      const sh=week.shifts.find(s=>s.day===day && (!dept||s.dept===dept) && s.assigned.includes(person.id));
      if(!sh) return `${person.name} isn't on a ${dept?DEPT_LABEL[dept]+" ":""}shift on ${DAY_LABEL[day]}.`;
      sh.assigned=sh.assigned.filter(id=>id!==person.id);
      reEvalShift(sh); render();
      return `Removed ${person.name} from ${DAY_LABEL[day]} ${DEPT_LABEL[sh.dept]} (${sh.name}).`;
    }
    const shs=week.shifts.filter(s=>s.day===day && !s.extra && (!dept||s.dept===dept));
    if(!shs.length) return `I don't see a ${dept?DEPT_LABEL[dept]+" ":""}shift on ${DAY_LABEL[day]}.`;
    // prefer a shift they can do that still needs people
    const ranked=shs.map(s=>({s,c:canAssign(person,s,week),gap:shiftRequirement(s).total-s.assigned.length})).sort((a,b)=>(b.c.ok-a.c.ok)||(b.gap-a.gap));
    const pick=ranked[0];
    if(!pick.c.ok) return `I can't put ${person.name} on ${DAY_LABEL[day]} ${DEPT_LABEL[pick.s.dept]}: ${pick.c.reason}.`;
    pick.s.assigned.push(person.id);
    reEvalShift(pick.s); render();
    return `Done — ${person.name} is now on ${DAY_LABEL[day]} ${DEPT_LABEL[pick.s.dept]} (${pick.s.name}, ${pick.s.start}-${pick.s.end}).`;
  }
  if(t.includes("hours")){
    const person=findStaffByName(text);
    if(person){
      const total=staffAssignedShifts(person.id,week).reduce((s,x)=>s+shiftHours(x),0);
      return `${person.name} is on ${total.toFixed(1)}h this week (contracted ${person.contractedHours}h, max ${person.maxHours}h).`;
    }
  }
  return "I can tell you what's on, who's working, who's free, why a shift is short, move/add/remove someone from a shift, or generate the rota. Try one of the quick suggestions below.";
}

// ---------- install as desktop app ----------
let installPrompt=null;
const installBtn=document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;installBtn.style.display="";});
installBtn.addEventListener("click",async()=>{
  if(!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt=null; installBtn.style.display="none";
});
window.addEventListener("appinstalled",()=>{installBtn.style.display="none";});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(function(){});});
}

// ---------- init ----------
render();
})();
</script>
