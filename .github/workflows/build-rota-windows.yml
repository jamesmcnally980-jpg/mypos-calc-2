name: Build Rota Windows app
on:
  workflow_dispatch:
  push:
    paths: ["rota-desktop/**"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rota-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Venue-Rota-Maker-Windows
          path: rota-desktop/dist/*.exe
